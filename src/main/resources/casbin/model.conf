# Modelo de políticas Casbin para control de permisos de Sílabos
# Formato: [request_definition]
[request_definition]
r = sub, obj, act

# [policy_definition]
[policy_definition]
p = sub, obj, act, eft

# [role_definition]
[role_definition]
g = _, _

# [policy_effect]
[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

# [matchers]
[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
