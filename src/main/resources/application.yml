quarkus:
  arc:

    unremovable-types:
      - "upeu.edu.pe.security.infrastructure.filters.JwtAuthenticationFilter"
    exclude-types: none
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234567}
    jdbc:
      url: jdbc:postgresql://localhost:5432/${DB_NAME:labacademico4}

  hibernate-orm:
    database:
      generation: update
    log:
      sql: true
      format-sql: true
    jdbc:
      statement-batch-size: 20

  flyway:
    migrate-at-start: false  # Deshabilitado - Hibernate maneja DDL, Java maneja datos
    # baseline-on-migrate: true
    # baseline-version: 0
    # baseline-description: Initial baseline
    # out-of-order: true

  devservices:
    enabled: false

  http:
    port: 8080
    cors:
      origins: "*"
      headers: "*"
      methods: "*"

  log:
    level: INFO
    min-level: TRACE

  security:
    jaxrs:
      deny-unannotated-endpoints: false
    auth:
      enabled-in-dev-mode: false


  smallrye-openapi:
    path: /swagger-ui

  smallrye-health:
    root-path: "/q/health"
    ui:
      always-include: true
    liveness-path: "/q/health/live"
    readiness-path: "/q/health/ready"

  jackson:
    write-dates-as-timestamps: false

  hibernate-validator:
    method-validation:
      allow-overriding-parameter-constraints: true

  micrometer:
    binder:
      jvm: true
      system: true
    export:
      prometheus:
        enabled: true
        path: "/q/metrics"

  cache:
    caffeine:
      "user-cache":
        initial-capacity: 100
        maximum-size: 1000
        expire-after-write: "10M"

